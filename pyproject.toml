[project]
name = "StockAPI"
version = "0.1.0"
description = "A small FastAPI service for S&P 500 market data"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "fastapi[standard] ~= 0.142.2",
    "httpx ~= 0.28.1",
    "lxml ~= 6.1.3",
    "beautifulsoup4 ~= 4.15.0",
    "pydantic ~= 2.13.0",
    "uvicorn[standard] ~= 0.30.0",
    "yfinance~=1.7.0",
    "curl-cffi~=0.16.3",
]

[dependency-groups]
dev = [
    "pytest ~= 8.3.0",
    "pytest-asyncio ~= 0.24.0",
    "ruff ~= 0.6.0",
]

[tool.uv]
package = false
